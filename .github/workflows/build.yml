name: LaTeX-Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Compile paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: ./wtsc_2025
          root_file: wtsc_2025.tex
      - name: Check PDF file
        run: |
          file wtsc_2025/wtsc_2025.pdf | grep -q ' PDF '
      - name: Compile Reunion 2025 slides
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: ./slides
          root_file: Reunion2025.tex
      - name: Check PDF file
        run: |
          file slides/Reunion2025.pdf | grep -q ' PDF '
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: signum-consensus
          path: |
            wtsc_2025/wtsc_2025.pdf
            slides/Reunion2025.pdf
        if: always()
